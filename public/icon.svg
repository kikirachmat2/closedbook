<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nibMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="featherCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#E60026"/>
    </linearGradient>
  </defs>

  <!-- Solid Dark Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#080808"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="rgba(255,255,255,0.09)" stroke-width="8" fill="none"/>

  <!-- Upper Feather Blade (Solid Crimson) -->
  <path d="M120 76 C236 76 364 172 396 312 C334 300 248 246 182 172 C148 134 130 100 120 76 Z" 
        fill="url(#featherCrimson)"/>

  <!-- Lower Feather Blade (Solid Crimson with Organic Dynamic Barb Cutouts) -->
  <path d="M184 220 C242 278 322 336 378 348 C346 388 280 402 226 382 C182 364 150 318 142 276 C156 258 170 238 184 220 Z" 
        fill="url(#featherCrimson)"/>

  <!-- Metallic Precision Nib Collar -->
